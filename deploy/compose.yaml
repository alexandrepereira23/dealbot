name: dealbot

services:
  api:
    extends: { file: compose.base.yaml, service: api }
    volumes:
      - type: bind
        source: ${MEDIA_HOST_DIR:?Defina o diretório de mídia}
        target: /data/media
        bind: { create_host_path: false }
    networks:
      servicos: {}
      proxy: { aliases: [dealbot-api] }

  bot:
    extends: { file: compose.base.yaml, service: bot }
    volumes:
      - type: bind
        source: ${STATE_HOST_DIR:?Defina o diretório privado do estado}
        target: /data/state
        bind: { create_host_path: false }
      - type: bind
        source: ${MEDIA_HOST_DIR:?Defina o diretório de mídia}
        target: /data/media
        bind: { create_host_path: false }
    networks: [servicos]

  painel:
    extends: { file: compose.base.yaml, service: painel }
    networks:
      proxy: { aliases: [dealbot-painel] }

networks:
  servicos: {}
  proxy:
    external: true
    name: ${CADDY_NETWORK:?Defina a rede existente do proxy}
