# Laboratório isolado; sem arquivos .env de produção, sem portas 80/443.
name: dealbot-etapa5-lab
services:
  preparar:
    image: dealbot-bot:lab
    build: { context: ../../bot }
    user: "0:0"
    entrypoint: [python, -c]
    command:
      - "import os; os.makedirs('/state',exist_ok=True); os.chown('/state',10001,10000); os.chmod('/state',0o700); os.makedirs('/media',exist_ok=True); os.chown('/media',0,10000); os.chmod('/media',0o2770); os.makedirs('/backup',exist_ok=True); os.chown('/backup',10001,10000); os.chmod('/backup',0o700)"
    volumes: ["estado:/state", "midia:/media", "backups:/backup"]
  supabase:
    image: node:24.22.3-bookworm-slim@sha256:dc26ae92c9fb15cf6b1d63e20f0944b2efe0f115b20e00be48fb23fceb061c54
    user: "10005:10005"
    read_only: true
    command: [node, /lab/supabase.mjs]
    environment: { LAB_BIND: "0.0.0.0" }
    volumes: [".:/lab:ro"]
    ports: ["127.0.0.1:54329:54329"]
  bot:
    image: dealbot-bot:lab
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:rw,noexec,nosuid,size=64m]
    command: [python, /lab/bot.py]
    environment:
      PYTHONPATH: /app:/opt/deps
      BOT_STATE_DIR: /data/state
      MIDIA_LOCAL_DIR: /data/media
      LAB_SUPABASE_URL: http://supabase:54329
    volumes: ["estado:/data/state", "midia:/data/media", "backups:/backup", ".:/lab:ro", "../scripts:/scripts:ro"]
    stop_grace_period: 90s
    depends_on:
      preparar: { condition: service_completed_successfully }
  api:
    image: dealbot-api:lab
    build: { context: ../../backend }
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:rw,noexec,nosuid,size=64m]
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      SUPABASE_URL: http://supabase:54329
      SUPABASE_SERVICE_KEY: e30.e30.sintetico
      SUPABASE_ANON_KEY: anon-sintetica
      CORS_ORIGIN: https://localhost:18443
      LIMPEZA_ATIVA: "false"
      MIDIA_LOCAL_DIR: /data/media
      MIDIA_SAIDA_MAX_BYTES: "358400"
    volumes: ["midia:/data/media", ".:/lab:ro"]
    stop_grace_period: 40s
    depends_on:
      preparar: { condition: service_completed_successfully }
  painel:
    image: dealbot-painel:lab
    build:
      context: ../../frontend
      args:
        NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54329
        NEXT_PUBLIC_SUPABASE_ANON_KEY: anon-sintetica
        NEXT_PUBLIC_API_URL: /api
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:rw,noexec,nosuid,size=64m]
  caddy:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    user: "10004:10004"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/data:uid=10004,gid=10004,mode=0700, /config:uid=10004,gid=10004,mode=0700]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro"]
    ports: ["127.0.0.1:18443:8443"]
  postgres:
    profiles: [sql]
    image: postgres:18.6-bookworm@sha256:f1ea2a1a4fb7b68d4836be1fdcb8a6466a89b072158bf9d97663600538c294c5
    environment: { POSTGRES_HOST_AUTH_METHOD: trust }
    tmpfs: [/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres]
      interval: 2s
      timeout: 3s
      retries: 20
  sql:
    profiles: [sql]
    build: { context: ../.., dockerfile: deploy/lab/Dockerfile.sql }
    network_mode: service:postgres
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  estado: {}
  midia: {}
  backups: {}
