# Laboratório isolado; sem arquivos .env de produção, sem portas 80/443.
name: dealbot-etapa5-lab
services:
  preparar:
    image: python:3.12.16-slim-bookworm@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df
    user: "0:0"
    read_only: true
    network_mode: none
    entrypoint: [python, /scripts/preparar-volumes.py, --bot-uid, "10001", --media-gid, "10000", --laboratorio]
    volumes:
      - estado:/state
      - midia:/media
      - backups:/backup
      - caddy_data:/caddy-data
      - dados_sinteticos:/sintetico
      - ../scripts:/scripts:ro
  supabase:
    image: node:24.22.3-bookworm-slim@sha256:dc26ae92c9fb15cf6b1d63e20f0944b2efe0f115b20e00be48fb23fceb061c54
    user: "10005:10005"
    read_only: true
    command: [node, /lab/supabase.mjs]
    environment: { LAB_BIND: "0.0.0.0", LAB_DADOS: "/sintetico/dados.json" }
    volumes: [".:/lab:ro", "dados_sinteticos:/sintetico"]
    ports: ["127.0.0.1:54329:54329"]
    depends_on:
      preparar: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:54329/__lab/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 15
  bot:
    image: dealbot-bot:lab
    build: { context: ../../bot }
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    command: [python, /lab/bot.py]
    environment:
      PYTHONPATH: /app:/opt/deps
      BOT_STATE_DIR: /data/state
      MIDIA_LOCAL_DIR: /data/media
      LAB_SUPABASE_URL: http://supabase:54329
    volumes: ["estado:/data/state", "midia:/data/media", "backups:/backup", ".:/lab:ro", "../scripts:/scripts:ro"]
    stop_grace_period: 90s
    depends_on:
      preparar: { condition: service_completed_successfully }
      supabase: { condition: service_healthy }
  api:
    image: dealbot-api:lab
    build: { context: ../../backend }
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      SUPABASE_URL: http://supabase:54329
      SUPABASE_SERVICE_KEY: e30.e30.sintetico
      SUPABASE_ANON_KEY: anon-sintetica
      CORS_ORIGIN: https://localhost:18443
      LIMPEZA_ATIVA: "false"
      MIDIA_LOCAL_DIR: /data/media
      MIDIA_SAIDA_MAX_BYTES: "358400"
    volumes: ["midia:/data/media", ".:/lab:ro"]
    stop_grace_period: 40s
    depends_on:
      preparar: { condition: service_completed_successfully }
      supabase: { condition: service_healthy }
  painel:
    image: dealbot-painel:lab
    build:
      context: ../../frontend
      args:
        NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54329
        NEXT_PUBLIC_SUPABASE_ANON_KEY: anon-sintetica
        NEXT_PUBLIC_API_URL: /api
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
  caddy:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    user: "10004:10004"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/config:uid=10004,gid=10004,mode=0700"]
    volumes:
      - type: volume
        source: caddy_data
        target: /data
        volume: { nocopy: true }
      - ../caddy/local.Caddyfile:/etc/caddy/Caddyfile:ro
    ports: ["127.0.0.1:18443:8443"]
    depends_on:
      preparar: { condition: service_completed_successfully }
      api: { condition: service_started }
      painel: { condition: service_started }
  postgres:
    profiles: [sql]
    image: postgres:18.6-bookworm@sha256:f1ea2a1a4fb7b68d4836be1fdcb8a6466a89b072158bf9d97663600538c294c5
    environment: { POSTGRES_HOST_AUTH_METHOD: trust }
    tmpfs: [/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres]
      interval: 2s
      timeout: 3s
      retries: 20
  sql:
    profiles: [sql]
    build: { context: ../.., dockerfile: deploy/lab/Dockerfile.sql }
    network_mode: service:postgres
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  estado: {}
  midia: {}
  backups: {}
  caddy_data: {}
  dados_sinteticos: {}
